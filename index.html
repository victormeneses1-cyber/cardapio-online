<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cardápio Arena</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

<!-- MENU -->
<div class="sidebar">
<h2>🍔 Arena</h2>

<button onclick="window.mostrar('pizzas')">🍕 Pizzas</button>
<button onclick="window.mostrar('espetinhos')">🍢 Espetinhos</button>
<button onclick="window.mostrar('cervejas')">🍺 Cervejas</button>
<button onclick="window.mostrar('bebidas')">🥤 Bebidas</button>
<button onclick="window.mostrar('porcoes')">🍟 Porções</button>
<button onclick="window.verHistorico()">📋 Histórico</button>
</div>

<!-- CONTEÚDO -->
<div class="conteudo">

<div id="inicio" class="inicio">
<h1>Bem-vindo à Arena São Francisco 🎾</h1>
<p>Peça de forma rápida e prática</p>

<button onclick="abrirCardapio()" class="btn-start">
🍔 Ver Cardápio
</button>
</div>

<div id="menu" class="menu"></div>

</div>

<!-- CARRINHO -->
<div class="carrinho">
<h2>🛒 Pedido</h2>

<input type="text" id="nome" placeholder="Seu nome">

<div id="carrinho"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="enviarPedido()">Enviar Pedido</button>
</div>

</div>

<script src="script.js?v=2"></script>

</body>
</html>
