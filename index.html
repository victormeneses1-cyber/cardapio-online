<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cardápio Arena São Francisco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <div class="sidebar" id="sidebar">
        <h2>🍔 Arena</h2>
        <button onclick="voltarInicio()">🏠 Home</button>
        <button onclick="mostrar('pizzas')">🍕 Pizzas</button>
        <button onclick="mostrar('espetinhos')">🍢 Espetinhos</button>
        <button onclick="mostrar('cervejas')">🍺 Cervejas</button>
        <button onclick="mostrar('bebidas')">🥤 Bebidas</button>
        <button onclick="mostrar('porcoes')">🍟 Porções</button>
        <button onclick="verHistorico()">📋 Histórico</button>
        <button class="btn-carrinho" onclick="toggleCarrinho()">🛒 Ver Pedido</button>
    </div>

    <div class="conteudo">
    <div id="inicio" class="inicio">
        <h1>Arena <span>São Francisco</span> 🎾</h1>
<p class="subtitulo">seu espaço</p>
        <button class="btn-start" onclick="abrirCardapio()">🍔 Ver Cardápio</button>
    </div>

    <div id="secao-professores" class="inicio" style="margin-top: 50px; width: 100%;">
    <h2>👨‍🏫 Nossos Professores</h2>
    <div id="lista-professores-home" class="menu"></div>
</div>

    <div id="container-professor" style="display:none;">
        <button class="btn-voltar-pequeno" onclick="voltarInicio()">⬅ Voltar</button>
        <div class="layout-professor">
            <div class="coluna-video">
                <h2 id="nome-prof-titulo"></h2>
                <video id="video-prof" controls width="100%" style="border-radius:15px;">
                    <source src="" type="video/mp4">
                </video>
            </div>
            <div id="agenda-semanal" class="coluna-agenda">
                </div>
        </div>
    </div>

    <div id="menu" class="menu"></div>
</div>

        <div id="menu" class="menu"></div>
    </div>

    <div class="carrinho">
        <h2>🛒 Pedido</h2>
        <input type="text" id="nome" placeholder="Seu nome">
        <div id="carrinho"></div>
        <p>Total: R$ <span id="total">0</span></p>
        <button onclick="enviarPedido()">Enviar Pedido</button>
    </div>
</div>

<script src="script.js"></script>

<div id="modal-nome" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#161b22; border:1px solid rgba(46,160,67,.25); border-radius:20px; padding:32px 28px; width:90%; max-width:380px; display:flex; flex-direction:column; align-items:center; gap:16px; animation:popIn .5s cubic-bezier(.34,1.4,.64,1) both;">
    <div style="width:60px;height:60px;border-radius:18px;background:#238636;display:flex;align-items:center;justify-content:center;font-size:28px;">🎾</div>
    <div style="font-size:22px;font-weight:900;color:#fff;text-align:center;">Arena <span style="color:#2ea043;">São Francisco</span></div>
    <div style="font-size:12px;color:rgba(255,255,255,.4);text-align:center;line-height:1.6;">Para personalizar seu pedido,<br>precisamos saber seu nome.</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:5px 12px;border-radius:20px;">
      <span style="width:6px;height:6px;border-radius:50%;background:#e74c3c;display:inline-block;"></span> Campo obrigatório
    </div>
    <div style="width:100%;position:relative;">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;">👤</span>
      <input type="text" id="modal-nome-input" placeholder="Digite seu nome..."
        style="width:100%;padding:13px 16px 13px 44px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:Arial,sans-serif;font-size:14px;outline:none;box-sizing:border-box;">
    </div>
    <div id="modal-erro" style="font-size:11px;color:#e74c3c;opacity:0;transition:opacity .2s;width:100%;">⚠ Por favor, informe seu nome antes de continuar.</div>
    <button onclick="confirmarNome()" style="width:100%;padding:13px;border-radius:14px;border:none;background:#238636;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;letter-spacing:.5px;">Entrar na Arena</button>
    <span style="font-size:11px;color:rgba(255,255,255,.2);">Seus dados não são salvos</span>
  </div>
</div>
</body>
</html>
