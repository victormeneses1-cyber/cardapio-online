<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cardápio Arena São Francisco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <div class="sidebar" id="sidebar">
        <h2>🍔 Arena</h2>
        <button onclick="mostrar('pizzas')">🍕 Pizzas</button>
        <button onclick="mostrar('espetinhos')">🍢 Espetinhos</button>
        <button onclick="mostrar('cervejas')">🍺 Cervejas</button>
        <button onclick="mostrar('bebidas')">🥤 Bebidas</button>
        <button onclick="mostrar('porcoes')">🍟 Porções</button>
        <button onclick="verHistorico()">📋 Histórico</button>
        <button class="btn-carrinho" onclick="toggleCarrinho()">🛒 Ver Pedido</button>
    </div>

    <div class="conteudo">

        <div id="inicio" class="inicio">
            <h1>Bem-vindo à Arena São Francisco 🎾</h1>
            <p>A melhor experiência em Beach Tennis e Gastronomia.</p>
            <button class="btn-start" onclick="abrirCardapio()">🍔 Ver Cardápio</button>
        </div>

        <div id="video-container" style="display:none; text-align:center; margin-bottom:20px;">
    <video id="video-professor" controls width="100%" style="max-width:600px; border-radius:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <source src="" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>
</div>

        <div id="secao-professores" class="inicio" style="margin-top: 50px;">
            <h2>👨‍🏫 Nossos Professores</h2>
            <div id="lista-professores-home" class="menu"></div>
        </div>

        <div id="menu" class="menu"></div>

    </div>

    <div class="carrinho">
        <h2>🛒 Seu Pedido</h2>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <div id="carrinho"></div>
        <p>Total: R$ <span id="total">0.00</span></p>
        <button onclick="enviarPedido()" style="background: #238636; color: white; width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold;">
            Enviar Pedido via WhatsApp
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
