<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena São Francisco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
 
<!-- TELA HOME -->
<div class="screen active" id="s-home">
    <div class="home-content">
        <h1 class="home-title">Arena <span>São Francisco</span> 🎾</h1>
        <p class="home-sub">seu espaço</p>
        <button class="btn-cardapio" onclick="irCardapio()">🍔 Ver Cardápio</button>
    </div>
    <div class="section-label">👨‍🏫 Nossos Professores</div>
    <div class="prof-grid" id="lista-professores-home"></div>
</div>
 
<!-- TELA CARDÁPIO -->
<div class="screen" id="s-cardapio">
    <div class="topbar">
        <button class="back-btn" onclick="irHome()">←</button>
        <span class="topbar-title">🍔 Cardápio</span>
    </div>
    <div class="cat-scroll" id="cat-scroll"></div>
    <div class="items-list" id="items-list"></div>
</div>
 
<!-- TELA PROFESSOR -->
<div class="screen" id="s-prof">
    <div class="topbar">
        <button class="back-btn" onclick="irHome()">←</button>
        <span class="topbar-title" id="prof-topbar-title"></span>
    </div>
    <div class="prof-video-wrap">
        <video id="video-prof" controls autoplay playsinline style="width:100%;height:100%;object-fit:cover;border-radius:0;"></video>
    </div>
    <div class="prof-info-bar">
        <h2 id="nome-prof-titulo"></h2>
        <span class="prof-badge" id="prof-badge"></span>
    </div>
    <div class="agenda-tabs" id="agenda-tabs"></div>
    <div class="horarios-list" id="horarios-list"></div>
</div>
 
<!-- TELA OPÇÕES -->
<div class="screen" id="s-opcoes">
    <div class="topbar">
        <button class="back-btn" onclick="voltarCardapio()">←</button>
        <span class="topbar-title" id="opcoes-title"></span>
    </div>
    <div class="items-list" id="opcoes-list"></div>
</div>
 
<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="irHome()">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" id="nav-cardapio" onclick="irCardapio()">
        <span class="nav-icon">🍔</span>
        <span class="nav-label">Cardápio</span>
    </div>
    <div class="nav-item" id="nav-aulas">
        <span class="nav-icon">👨‍🏫</span>
        <span class="nav-label">Aulas</span>
    </div>
    <div class="nav-item" id="nav-pedido" onclick="abrirCarrinho()">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">Pedido</span>
        <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
    </div>
</div>
 
<!-- CARRINHO SLIDE UP -->
<div class="carrinho-overlay" id="carrinho-overlay" onclick="fecharCarrinho()"></div>
<div class="carrinho" id="carrinho-panel">
    <div class="carrinho-handle"></div>
    <h2 class="carrinho-title">🛒 Seu Pedido</h2>
    <input type="text" id="nome" placeholder="Seu nome" class="nome-input">
    <div id="carrinho-items"></div>
    <div class="carrinho-footer">
        <div class="carrinho-total">
            <span>Total</span>
            <span id="total-value">R$ 0,00</span>
        </div>
        <button class="btn-enviar" onclick="enviarPedido()">Enviar Pedido</button>
    </div>
</div>
 
<!-- MODAL NOME -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🎾</div>
        <div class="modal-title">Arena <span>São Francisco</span></div>
        <div class="modal-desc">Para personalizar seu pedido,<br>precisamos saber seu nome.</div>
        <div class="modal-obrig"><span class="dot-red"></span> Campo obrigatório</div>
        <div class="modal-input-wrap">
            <span class="modal-input-icon">👤</span>
            <input type="text" id="modal-nome-input" placeholder="Digite seu nome...">
        </div>
        <div id="modal-erro" class="modal-erro">⚠ Por favor, informe seu nome.</div>
        <button class="modal-btn" onclick="confirmarNome()">Entrar na Arena</button>
        <span class="modal-rodape">Seus dados não são salvos</span>
    </div>
</div>
 
<script src="script.js"></script>
</body>
</html>
